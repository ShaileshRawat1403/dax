name: "DAX Repo Analyze Gate"
description: "Invoke DAX governed analysis via FastMCP and return structured results"
author: "DAX"

inputs:
  dax-url:
    description: "DAX FastMCP substrate URL (e.g. http://localhost:4730)"
    required: true
  dax-token:
    description: "Bearer token for DAX substrate auth"
    required: false
  intent:
    description: "Natural language intent for the analysis"
    required: true
  workflow:
    description: "Workflow class (default: repo_analyze)"
    required: false
    default: "repo_analyze"
  poll-interval:
    description: "Seconds between status polls (default: 5)"
    required: false
    default: "5"
  max-wait:
    description: "Max seconds to wait for completion (default: 300)"
    required: false
    default: "300"
  repo-path:
    description: "Path to repository to analyze (default: GitHub workspace)"
    required: false

outputs:
  run-id:
    description: "The DAX run ID"
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: "Final run status (completed, failed, running, waiting_approval)"
    value: ${{ steps.run.outputs.status }}
  terminal-reason:
    description: "Terminal reason if run ended (contract_mutation, permission_denied, timeout, etc.)"
    value: ${{ steps.run.outputs.terminal-reason }}
  outcome:
    description: "Outcome result (success, failure, pending)"
    value: ${{ steps.run.outputs.outcome }}
  summary-text:
    description: "Human-readable summary"
    value: ${{ steps.run.outputs.summary-text }}

runs:
  using: "composite"
  steps:
    - name: Run DAX analysis gate
      id: run
      shell: bash
      env:
        INPUT_DAX_URL: ${{ inputs.dax-url }}
        INPUT_DAX_TOKEN: ${{ inputs.dax-token }}
        INPUT_INTENT: ${{ inputs.intent }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_POLL_INTERVAL: ${{ inputs.poll-interval }}
        INPUT_MAX_WAIT: ${{ inputs.max-wait }}
        INPUT_REPO_PATH: ${{ inputs.repo-path || github.workspace }}
        GITHUB_OUTPUT: ${{ runner.app_repo_path }}/_runner/_work/_temp/_runner_github_output.tmp
        GITHUB_STEP_SUMMARY: ${{ runner.app_repo_path }}/_runner/_work/_temp/_runner_github_summary.tmp
      run: |
        set -euo pipefail

        echo "::group::DAX Repo Analyze Gate"

        POLL_INTERVAL="${INPUT_POLL_INTERVAL:-5}"
        MAX_WAIT="${INPUT_MAX_WAIT:-300}"
        INTENT="$INPUT_INTENT"
        WORKFLOW="${INPUT_WORKFLOW:-repo_analyze}"
        REPO_PATH="${INPUT_REPO_PATH:-$GITHUB_WORKSPACE}"

        if [ -n "$INPUT_DAX_TOKEN" ]; then
          AUTH_HEADER="Authorization: Bearer $INPUT_DAX_TOKEN"
        else
          AUTH_HEADER=""
        fi

        echo "Creating DAX run..."
        MCP_RESPONSE=$(curl -s -X POST "$INPUT_DAX_URL/" \
          -H "Content-Type: application/json" \
          ${AUTH_HEADER:+"$AUTH_HEADER"} \
          -d '{
            "jsonrpc": "2.0",
            "id": 1,
            "method": "tools/call",
            "params": {
              "name": "run.create",
              "arguments": {
                "intent": {
                  "input": "'"$INTENT"'",
                  "kind": "analysis",
                  "repoPath": "'"$REPO_PATH"'"
                },
                "workflowHint": "'"$WORKFLOW"'",
                "metadata": {
                  "source": "api"
                }
              }
            }
          }')

        echo "MCP response: $MCP_RESPONSE"

        RUN_ID=$(echo "$MCP_RESPONSE" | grep -o '"runId":"[^"]*"' | head -1 | sed 's/"runId":"//;s/"//')
        if [ -z "$RUN_ID" ]; then
          echo "error=Failed to create DAX run" >> "$GITHUB_OUTPUT"
          echo "status=error" >> "$GITHUB_OUTPUT"
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          echo "::error::Failed to create DAX run: $MCP_RESPONSE"
          exit 1
        fi

        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "Created run: $RUN_ID"

        ELAPSED=0
        while [ $ELAPSED -lt "$MAX_WAIT" ]; do
          sleep "$POLL_INTERVAL"
          ELAPSED=$((ELAPSED + POLL_INTERVAL))

          STATUS_RESPONSE=$(curl -s -X POST "$INPUT_DAX_URL/" \
            -H "Content-Type: application/json" \
            ${AUTH_HEADER:+"$AUTH_HEADER"} \
            -d '{
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/call",
              "params": {
                "name": "run.get",
                "arguments": { "runId": "'"$RUN_ID"'" }
              }
            }')

          echo "[$(date +%T)] Polling run $RUN_ID... (${ELAPSED}s/${MAX_WAIT}s)"

          STATUS=$(echo "$STATUS_RESPONSE" | grep -o '"status":"[^"]*"' | head -1 | sed 's/"status":"//;s/"//')
          TERMINAL=$(echo "$STATUS_RESPONSE" | grep -o '"terminalReason":"[^"]*"' | head -1 | sed 's/"terminalReason":"//;s/"//')

          if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then
            echo "Run finished with status: $STATUS (terminal: $TERMINAL)"
            break
          fi
        done

        if [ "$STATUS" = "completed" ]; then
          OUTCOME="success"
          SUMMARY_TEXT="Analysis completed successfully"
        elif [ "$STATUS" = "failed" ]; then
          OUTCOME="failure"
          if [ "$TERMINAL" = "contract_mutation" ]; then
            SUMMARY_TEXT="Run failed: contract mutation detected"
          elif [ "$TERMINAL" = "permission_denied" ]; then
            SUMMARY_TEXT="Run failed: permission denied"
          elif [ "$TERMINAL" = "timeout" ]; then
            SUMMARY_TEXT="Run failed: timeout"
          else
            SUMMARY_TEXT="Run failed: $TERMINAL"
          fi
        elif [ "$STATUS" = "cancelled" ]; then
          OUTCOME="failure"
          SUMMARY_TEXT="Run was cancelled"
        else
          OUTCOME="failure"
          SUMMARY_TEXT="Run timed out after ${MAX_WAIT}s"
          STATUS="timeout"
          TERMINAL="timeout"
        fi

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "terminal-reason=${TERMINAL:-none}" >> "$GITHUB_OUTPUT"
        echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
        echo "summary-text=$SUMMARY_TEXT" >> "$GITHUB_OUTPUT"

        echo "---" >> "$GITHUB_STEP_SUMMARY"
        echo "## DAX Repo Analyze Gate" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Run ID | \`$RUN_ID\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Outcome | $OUTCOME |" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$TERMINAL" ]; then
          echo "| Terminal Reason | \`$TERMINAL\` |" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "$SUMMARY_TEXT" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "::endgroup::"

        if [ "$OUTCOME" = "failure" ]; then
          echo "::error::DAX analysis failed: $SUMMARY_TEXT"
          exit 1
        fi

        echo "DAX analysis passed"
