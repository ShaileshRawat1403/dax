name: Release Build & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install

      # One reusable root command, shared with local release verification, so a
      # tag can never publish a commit that bypassed the essential gates. This
      # runs repo integrity, legacy guard, typecheck, lint, tests, smoke evals,
      # Rust fmt/clippy/test and release:check — and it runs before build and
      # upload, so a failing gate stops publication rather than annotating it.
      - name: Verify release gates
        run: bun run release:gates

      - name: Build canonical release assets
        run: bun run build
        working-directory: packages/dax
        env:
          DAX_CHANNEL: ${{ contains(github.ref_name, '-beta.') && 'beta' || 'latest' }}

      - name: List release assets
        run: find packages/dax/dist/release -maxdepth 1 -type f | sort

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: packages/dax/dist/release/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/dax/dist/release/*.tar.gz
            packages/dax/dist/release/*.zip
            packages/dax/dist/release/manifest.json
            packages/dax/dist/release/SHA256SUMS
            packages/dax/dist/release/install.sh
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
