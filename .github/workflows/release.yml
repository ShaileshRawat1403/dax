name: Release Build & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --os="*" --cpu="*" @opentui/core @parcel/watcher
          bun install

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build
        run: bun run build
        working-directory: packages/dax

      - name: Create archives
        run: |
          cd packages/dax/dist
          for dir in dax-*; do
            if [ -d "$dir" ]; then
              name="${dir}.tar.gz"
              tar -czf "$name" "$dir"
            fi
          done

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "DAX ${{ steps.version.outputs.VERSION }}"
          draft: false
          files: |
            packages/dax/dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
