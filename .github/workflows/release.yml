name: Release Build & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --os="*" --cpu="*" @opentui/core @parcel/watcher
          bun install

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build for current platform
        run: bun run build -- --single
        working-directory: packages/dax

      - name: Create archive
        shell: bash
        run: |
          cd packages/dax/dist
          PLATFORM=""
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            PLATFORM="darwin"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            PLATFORM="win32"
          else
            PLATFORM="linux"
          fi
          
          ARCH=$(uname -m)
          if [[ "$ARCH" == "x86_64" ]]; then
            ARCH="x64"
          elif [[ "$ARCH" == "arm64" ]]; then
            ARCH="arm64"
          fi
          
          DIR="dax-$PLATFORM-$ARCH"
          if [ -d "$DIR" ]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              powershell -Command "Compress-Archive -Path $DIR/* -DestinationPath dax-$PLATFORM-$ARCH.zip -Force"
            else
              tar -czf dax-$PLATFORM-$ARCH.tar.gz $DIR
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dax-${{ runner.os }}-${{ runner.arch }}
          path: packages/dax/dist/*.tar.gz
          path: packages/dax/dist/*.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "DAX ${{ steps.version.outputs.VERSION }}"
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
