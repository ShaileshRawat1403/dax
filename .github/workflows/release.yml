name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true

env:
  BUN_VERSION: "1.3.9"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: dax-darwin-arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact_name: dax-darwin-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: dax-linux-x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: dax-linux-arm64
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_name: dax-windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.platform }}-${{ matrix.arch }}
        run: bun run build -- --single --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Create archive
        shell: bash
        run: |
          cd packages/dax/dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            powershell -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact_name }}.zip -Force"
          else
            tar -czf ../${{ matrix.artifact_name }}.tar.gz *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/dax/${{ matrix.artifact_name }}.*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "DAX ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact_name: dax-darwin-arm64
            archive_name: dax-darwin-arm64.tar.gz
          - artifact_name: dax-darwin-x64
            archive_name: dax-darwin-x64.tar.gz
          - artifact_name: dax-linux-x64
            archive_name: dax-linux-x64.tar.gz
          - artifact_name: dax-linux-arm64
            archive_name: dax-linux-arm64.tar.gz
          - artifact_name: dax-windows-x64
            archive_name: dax-windows-x64.zip

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ShaileshRawat1403/homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}

      - name: Get version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Update Homebrew formula
        run: |
          # Calculate SHA for each platform
          curl -sL "https://github.com/ShaileshRawat1403/dax/releases/download/v$VERSION/dax-darwin-arm64.tar.gz" | sha256sum
          curl -sL "https://github.com/ShaileshRawat1403/dax/releases/download/v$VERSION/dax-darwin-x64.tar.gz" | sha256sum
          curl -sL "https://github.com/ShaileshRawat1403/dax/releases/download/v$VERSION/dax-linux-x64.tar.gz" | sha256sum
          curl -sL "https://github.com/ShaileshRawat1403/dax/releases/download/v$VERSION/dax-linux-arm64.tar.gz" | sha256sum

      - name: Commit Homebrew formula
        run: |
          git config --local user.email "shailesh.rawat1403@gmail.com"
          git config --local user.name "ShaileshRawat1403"
          git add .
          git commit -m "Update DAX to $VERSION"
          git push
