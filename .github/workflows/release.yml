name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: dax-darwin-arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact_name: dax-darwin-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: dax-linux-x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: dax-linux-arm64
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_name: dax-windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install cross-platform dependencies
        run: bun install --os="*" --cpu="*" @opentui/core @parcel/watcher
        working-directory: packages/dax

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.platform }}-${{ matrix.arch }}
        run: bun run build -- --single --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: packages/dax

      - name: Create archive
        shell: bash
        run: |
          cd packages/dax/dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            cd dax-${{ matrix.platform }}-${{ matrix.arch }}
            powershell -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact_name }}.zip -Force"
          else
            tar -czf ../${{ matrix.artifact_name }}.tar.gz dax-${{ matrix.platform }}-${{ matrix.arch }}
          fi
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/dax/${{ matrix.artifact_name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/github-script@v7
        id: create-release
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Check if release already exists
            try {
              const existing = await github.request('GET /repos/{owner}/{repo}/releases/tags/{tag}', {
                owner, repo, tag: version
              });
              if (existing.data.id) {
                console.log('Release already exists:', existing.data.id);
                return existing.data.id;
              }
            } catch (e) {
              // Release doesn't exist, create it
            }
            
            // Get latest commit for changelog
            const commit = await github.request('GET /repos/{owner}/{repo}/commits/{ref}', {
              owner, repo, ref: 'HEAD'
            });
            
            const changelog = `## Installation

### macOS/Linux
\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/${owner}/${repo}/main/script/install.sh | bash
\`\`\`

### Homebrew
\`\`\`bash
brew install ${owner}/tap/dax
\`\`\`

### Windows
\`\`\`bash
winget install DaxAi.DAX
\`\`\`

## Changes
See [CHANGELOG.md](https://github.com/${owner}/${repo}/blob/main/CHANGELOG.md) for full details.
`;
            
            const release = await github.request('POST /repos/{owner}/{repo}/releases', {
              owner,
              repo,
              tag_name: version,
              name: 'DAX ' + version,
              body: changelog,
              draft: false,
              prerelease: version.includes('alpha') || version.includes('beta')
            });
            console.log('Created release:', release.data.id);
            return release.data.id;
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload Release Assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = process.env.VERSION;
            const artifactsDir = 'artifacts';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get release ID from previous step
            const releaseResult = await github.request('GET /repos/{owner}/{repo}/releases/tags/{tag}', {
              owner,
              repo,
              tag: releaseId
            });
            
            const relId = releaseResult.data.id;
            console.log('Uploading to release:', relId);
            
            // Upload each artifact
            const files = fs.readdirSync(artifactsDir);
            for (const file of files) {
              const filePath = path.join(artifactsDir, file);
              const stat = fs.statSync(filePath);
              if (stat.isFile()) {
                console.log('Uploading:', file);
                const mediaType = file.endsWith('.zip') ? 'application/zip' : 'application/gzip';
                
                const upload = await github.request('POST /repos/{owner}/{repo}/releases/{release_id}/assets', {
                  owner,
                  repo,
                  release_id: relId,
                  name: path.basename(filePath),
                  mediaType: mediaType
                }, {
                  data: fs.createReadStream(filePath)
                });
                console.log('Uploaded:', file);
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}