name: Release Build & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --os="*" --cpu="*" @opentui/core @parcel/watcher
          bun install

      - name: Verify release inputs
        run: bun run release:check

      - name: Build canonical release assets
        run: bun run build
        working-directory: packages/dax
        env:
          DAX_CHANNEL: "latest"

      - name: List release assets
        run: find packages/dax/dist/release -maxdepth 1 -type f | sort

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: packages/dax/dist/release/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/dax/dist/release/*.tar.gz
            packages/dax/dist/release/*.zip
            packages/dax/dist/release/manifest.json
            packages/dax/dist/release/SHA256SUMS
            packages/dax/dist/release/install.sh
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
