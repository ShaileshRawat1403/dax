name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true

env:
  BUN_VERSION: "1.3.9"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: dax-darwin-arm64
            archive_ext: tar.gz
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact_name: dax-darwin-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: dax-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: dax-linux-arm64
            archive_ext: tar.gz
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_name: dax-windows-x64
            archive_ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.platform }}-${{ matrix.arch }}
        run: bun run build -- --single --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: packages/dax

      - name: Create archive
        shell: bash
        run: |
          cd packages/dax/dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            powershell -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact_name }}.zip -Force"
          else
            tar -czf ../${{ matrix.artifact_name }}.tar.gz *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/dax/${{ matrix.artifact_name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: "DAX ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}
          artifacts: "artifacts/*"
          artifactContentType: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
