name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: dax-darwin-arm64
            archive_ext: tar.gz
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact_name: dax-darwin-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: dax-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: dax-linux-arm64
            archive_ext: tar.gz
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_name: dax-windows-x64
            archive_ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.platform }}-${{ matrix.arch }}
        run: bun run build -- --single --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: packages/dax

      - name: Create archive
        shell: bash
        run: |
          cd packages/dax/dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            powershell -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact_name }}.zip -Force"
          else
            tar -czf ../${{ matrix.artifact_name }}.tar.gz *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/dax/${{ matrix.artifact_name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

- name: Upload Release Assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const artifactsDir = 'artifacts';
            const releaseTag = process.env.VERSION;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get release by tag
            const releaseResp = await github.request('GET /repos/{owner}/{repo}/releases/tags/{tag}', {
              owner,
              repo,
              tag: releaseTag
            });
            const releaseId = releaseResp.data.id;

            // Upload each artifact
            const files = fs.readdirSync(artifactsDir);
            for (const file of files) {
              const filePath = path.join(artifactsDir, file);
              const stat = fs.statSync(filePath);
              if (stat.isFile()) {
                console.log(`Uploading ${file}...`);
                const mediaType = file.endsWith('.zip') ? 'application/zip' : 'application/gzip';
                await github.request('POST /repos/{owner}/{repo}/releases/{release_id}/assets', {
                  owner,
                  repo,
                  release_id: releaseId,
                  name: path.basename(filePath),
                  mediaType: mediaType
                }, {
                  data: fs.createReadStream(filePath)
                });
                console.log(`Uploaded ${file}`);
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
