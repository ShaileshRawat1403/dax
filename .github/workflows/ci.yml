name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
      - fix/**
      - chore/**
      - docs/**
      - release/**
      - test/**
      - wo-*
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install ripgrep
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y ripgrep
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level high

      - name: Windows isolated debug fixture reproduction (temporary diagnostic)
        id: windows_debug_repro
        if: runner.os == 'Windows'
        env:
          DAX_DISABLE_MODELS_FETCH: "1"
          DAX_EXPERIMENTAL_DISABLE_FILEWATCHER: "1"
          DAX_DISABLE_CONFIG_AUTO_INSTALL: "1"
          DAX_DISABLE_SHADOW_AUDIT: "1"
          DAX_DISABLE_RUN_NOTICE: "1"
        run: bun test packages/dax/src/capability/native-dispatch.test.ts -t 'real debug handler'

      - name: Windows owned fixture teardown inventory (temporary diagnostic)
        if: failure() && steps.windows_debug_repro.outcome == 'failure'
        env:
          DAX_DEBUG_TEARDOWN_DIAGNOSTICS: "1"
          DAX_DISABLE_MODELS_FETCH: "1"
          DAX_EXPERIMENTAL_DISABLE_FILEWATCHER: "1"
          DAX_DISABLE_CONFIG_AUTO_INSTALL: "1"
          DAX_DISABLE_SHADOW_AUDIT: "1"
          DAX_DISABLE_RUN_NOTICE: "1"
        run: bun test packages/dax/src/capability/native-dispatch.test.ts -t 'real debug handler'

      - name: Check repo integrity
        run: bun run check:repo

      - name: Guard frozen legacy roots
        if: runner.os != 'Windows'
        run: bun run guard:legacy

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test --coverage

      - name: Smoke evals
        run: bun run eval:smoke

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --workspace
