<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-label="DAX-hound Conceptual Glyph">
  <!-- 
    DAX HOUND V3: ARCHITECTURAL GLYPH 
    Style: Minimalist Stencil / Swiss Grid
    Concept: Software Architecture as a Form
  -->
  
  <g transform="translate(40, 45)">
    <!-- 1. THE REAR PILLAR (Override) -->
    <rect x="0" y="20" width="35" height="50" rx="2" fill="#0C1638" />
    
    <!-- 2. THE MIDDLE PILLAR (Audit) -->
    <rect x="50" y="20" width="35" height="50" rx="2" fill="#0C1638" />
    
    <!-- 3. THE FRONT PILLAR (Run) -->
    <rect x="100" y="20" width="35" height="50" rx="2" fill="#0C1638" />

    <!-- 4. THE CONNECTIVE SPINE (Deterministic Path) -->
    <rect x="0" y="20" width="135" height="12" rx="1" fill="#4F7BFF" />

    <!-- 5. THE ARCHITECTURAL HEAD (Command Wedge) -->
    <!-- This forms the 'head' but is actually a sharp logic-gate silhouette -->
    <path d="
      M 150,0 
      L 210,35 
      L 150,70 
      L 150,55 
      L 180,35 
      L 150,15 
      Z" 
      fill="#4F7BFF" />

    <!-- 6. THE GOVERNANCE EAR (Modular Bracket) -->
    <!-- Acts as a 'D' pivot and provides the hound profile hint -->
    <path d="
      M 145,0 
      L 165,0 
      L 165,60 
      L 145,60 
      L 145,50 
      L 155,50 
      L 155,10 
      L 145,10 
      Z" 
      fill="#0C1638" />

    <!-- 7. THE ACTIVE CURSOR (The Tail) -->
    <rect x="-15" y="10" width="6" height="35" rx="1" fill="#34C759" />
    
    <!-- 8. THE GROUNDING (Legs as Terminal Ticks) -->
    <rect x="15" y="75" width="4" height="15" fill="#0C1638" opacity="0.4" />
    <rect x="65" y="75" width="4" height="15" fill="#0C1638" opacity="0.4" />
    <rect x="115" y="75" width="4" height="15" fill="#0C1638" opacity="0.4" />
  </g>
</svg>
