<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-label="DAX-hound Mascot">
  <defs>
    <linearGradient id="houndGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7BFF" />
      <stop offset="100%" stop-color="#7A4DFF" />
    </linearGradient>
  </defs>

  <!-- The DAX-hound: Professional Vector Silhouette -->
  <g transform="translate(20, 20)">
    
    <!-- Body & Head Silhouette (Single Fluid Path) -->
    <path d="
      M 320,40 
      C 340,40 355,55 355,75 
      L 355,85 
      C 355,95 345,105 330,105 
      L 280,105 
      C 270,105 260,100 260,90 
      L 260,85 
      L 80,85 
      C 60,85 45,75 45,65 
      L 45,60 
      C 45,50 55,40 70,40 
      L 260,40 
      C 260,25 275,15 295,15 
      L 315,15 
      C 330,15 345,25 345,40 
      Z" 
      fill="url(#houndGradient)" />

    <!-- RAO "Governance" Cutouts -->
    <circle cx="100" cy="65" r="10" fill="#FFFFFF" />
    <circle cx="165" cy="65" r="10" fill="#FFFFFF" />
    <circle cx="230" cy="65" r="10" fill="#FFFFFF" />

    <!-- Syntax Ear: Stylized Bracket ] -->
    <path d="M 275,30 Q 260,30 260,55 L 260,85 Q 260,95 275,95 L 275,85 L 270,85 L 270,40 L 275,40 Z" fill="#0C1638" />

    <!-- Eye: Command Prompt > -->
    <path d="M 305,45 L 318,55 L 305,65" 
      stroke="#34C759" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" />

    <!-- Tail: Blinking Cursor _ -->
    <rect x="15" cy="60" width="25" height="8" rx="2" fill="url(#houndGradient)" />

    <!-- Short Sturdy Legs -->
    <rect x="90" y="85" width="12" height="30" rx="6" fill="url(#houndGradient)" />
    <rect x="235" y="85" width="12" height="30" rx="6" fill="url(#houndGradient)" />
  </g>
</svg>
