<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-label="DAX-hound Mascot">
  <defs>
    <linearGradient id="houndGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F7BFF" />
      <stop offset="100%" stop-color="#7A4DFF" />
    </linearGradient>
  </defs>

  <!-- The DAX-hound: Geometric Line-Art Style -->
  <g transform="translate(40, 40)">
    <!-- Body: Long and segmented (The Milestone Stream) -->
    <rect x="40" y="45" width="220" height="40" rx="20" fill="url(#houndGradient)" />
    
    <!-- RAO "Holes" (Run, Audit, Override) -->
    <circle cx="85" cy="65" r="8" fill="#FFFFFF" />
    <circle cx="150" cy="65" r="8" fill="#FFFFFF" />
    <circle cx="215" cy="65" r="8" fill="#FFFFFF" />

    <!-- Head: Precise Square with Bracket Ear -->
    <rect x="255" y="20" width="55" height="55" rx="8" fill="url(#houndGradient)" />
    
    <!-- Ear: Square Bracket Shape ] -->
    <path d="M250 20 h10 v40 h-10 v-5 h5 v-30 h-5 z" fill="#0C1638" opacity="0.8" />

    <!-- Eye: Command Prompt > -->
    <path d="M275 40 l12 8 l-12 8" stroke="#34C759" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Tail: Blinking Cursor _ -->
    <rect x="10" y="60" width="20" height="6" fill="url(#houndGradient)" />

    <!-- Legs: Solid Pillars -->
    <rect x="75" y="85" width="10" height="25" rx="5" fill="url(#houndGradient)" />
    <rect x="225" y="85" width="10" height="25" rx="5" fill="url(#houndGradient)" />
  </g>
</svg>
